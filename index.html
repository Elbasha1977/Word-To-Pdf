<!DOCTYPE html>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-animation"></div>

<div class="container">

    <div class="header">
        <img src="https://i.postimg.cc/zBJgPc40/MOTTO.png" class="logo">
    </div>

    <div class="card">

        <div class="developer">
            <img src="https://i.postimg.cc/h4dPn3tR/my-picture.jpg" class="avatar">

            <div>
                <h3>Abdelbaset Atia</h3>
                <p>Full Stack Developer</p>
            </div>
        </div>

        <h1>📄 تحويل Word إلى PDF</h1>

        <p class="subtitle">
            تحويل احترافي مع الحفاظ على التنسيق الكامل
        </p>

        <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept=".doc,.docx" hidden>

            <div class="upload-content">
                <div class="upload-icon">📂</div>
                <h2>اسحب الملف هنا</h2>
                <p>أو اضغط لاختيار ملف Word</p>
            </div>
        </div>

        <div id="fileName"></div>

        <button id="convertBtn">
            🔄 تحويل إلى PDF
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="status"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
